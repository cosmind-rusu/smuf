<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>

    <!-- Background gradient: deep dark left → slightly lighter right -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#15181e"/>
    </linearGradient>

    <!-- Subtle red glow behind the cloud -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E53E3E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E53E3E" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud gradient -->
    <radialGradient id="cloudGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#9B1C1C"/>
    </radialGradient>

    <!-- Cloud shine -->
    <linearGradient id="cloudShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cloud drop shadow -->
    <filter id="cloudShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12"
                    flood-color="#E53E3E" flood-opacity="0.40"/>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- Faint red horizontal line -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E53E3E" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#E53E3E" stop-opacity="0.6"/>
      <stop offset="70%"  stop-color="#E53E3E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E53E3E" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <!-- Dot texture -->
  <rect width="1200" height="360" fill="url(#dots)"/>

  <!-- ── Red ambient glow centred on cloud area ── -->
  <ellipse cx="260" cy="180" rx="220" ry="160" fill="url(#glow)"/>

  <!-- ── Faint red separator line at bottom ── -->
  <rect x="0" y="340" width="1200" height="1" fill="url(#lineGrad)" opacity="0.5"/>

  <!-- ── Cloud (scaled ~3.2×, centred at 260,180) ── -->
  <g transform="translate(120,90) scale(3.2)" filter="url(#cloudShadow)">
    <g fill="url(#cloudGrad)">
      <rect x="12" y="36" width="76" height="26" rx="13"/>
      <circle cx="30" cy="37" r="15"/>
      <circle cx="52" cy="28" r="21"/>
      <circle cx="72" cy="37" r="13"/>
    </g>
    <g fill="url(#cloudShine)">
      <rect x="12" y="36" width="76" height="26" rx="13"/>
      <circle cx="30" cy="37" r="15"/>
      <circle cx="52" cy="28" r="21"/>
      <circle cx="72" cy="37" r="13"/>
    </g>
    <!-- Specular highlight -->
    <ellipse cx="40" cy="23" rx="11" ry="6"
             fill="#ffffff" opacity="0.15"
             transform="rotate(-18,40,23)"/>
  </g>

  <!-- ── Uppercase label (section marker, Design.md §3) ── -->
  <text x="520" y="126"
        font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial"
        font-size="13" font-weight="600" letter-spacing="1.3"
        text-transform="uppercase" fill="#656a76"
        dominant-baseline="middle">
    SELF-HOSTED HTTP TUNNEL
  </text>

  <!-- ── Hero headline: "smuf" ── -->
  <text x="516" y="200"
        font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial"
        font-size="96" font-weight="700" letter-spacing="-2"
        fill="#efeff1" dominant-baseline="middle">
    smuf
  </text>

  <!-- ── Red accent underline beneath the headline ── -->
  <rect x="516" y="248" width="200" height="3" rx="2" fill="#E53E3E" opacity="0.85"/>

  <!-- ── Tagline / body large (Design.md §3) ── -->
  <text x="516" y="286"
        font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial"
        font-size="20" font-weight="400" fill="#b2b6bd" letter-spacing="0">
    Expone tu app local a Internet. Sin depender de nadie.
  </text>

  <!-- ── Version badge ── -->
  <rect x="516" y="316" width="96" height="26" rx="5"
        fill="#1a0000" stroke="#E53E3E" stroke-width="1" stroke-opacity="0.6"/>
  <text x="564" y="329"
        font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial"
        font-size="12" font-weight="600" fill="#FF4D4D"
        text-anchor="middle" dominant-baseline="middle">
    Go · MIT
  </text>

  <!-- ── "self-hosted" badge ── -->
  <rect x="622" y="316" width="110" height="26" rx="5"
        fill="#0d0e12" stroke="#656a76" stroke-width="1" stroke-opacity="0.5"/>
  <text x="677" y="329"
        font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial"
        font-size="12" font-weight="600" fill="#b2b6bd"
        text-anchor="middle" dominant-baseline="middle">
    self-hosted ✓
  </text>

</svg>
