<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72" width="100" height="72">
  <defs>
    <!-- Red radial gradient for cloud body -->
    <radialGradient id="cloudGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </radialGradient>
    <!-- Soft drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#B91C1C" flood-opacity="0.35"/>
    </filter>
    <!-- Shine mask -->
    <linearGradient id="shine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cloud shape (union of circles + rect) with gradient + shadow -->
  <g filter="url(#shadow)">
    <g fill="url(#cloudGrad)">
      <rect x="12" y="36" width="76" height="26" rx="13"/>
      <circle cx="30" cy="37" r="15"/>
      <circle cx="52" cy="28" r="21"/>
      <circle cx="72" cy="37" r="13"/>
    </g>
    <!-- Shine overlay -->
    <g fill="url(#shine)">
      <rect x="12" y="36" width="76" height="26" rx="13"/>
      <circle cx="30" cy="37" r="15"/>
      <circle cx="52" cy="28" r="21"/>
      <circle cx="72" cy="37" r="13"/>
    </g>
  </g>

  <!-- Top-left specular highlight -->
  <ellipse cx="40" cy="23" rx="11" ry="6"
           fill="#ffffff" opacity="0.18"
           transform="rotate(-18,40,23)"/>
</svg>
